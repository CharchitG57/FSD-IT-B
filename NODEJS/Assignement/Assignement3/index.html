<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popular Picks</title>

    <style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        margin: 0;
        padding: 30px;
        background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
    }

    h1 {
        text-align: center;
        margin-bottom: 40px;
        font-size: 32px;
        color: #333;
        letter-spacing: 1px;
    }

    .wrapper {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 25px;
        max-width: 1100px;
        margin: auto;
    }

    a {
        text-decoration: none;
        color: inherit;
    }

    .container {
        background: white;
        padding: 15px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        cursor: pointer;
    }

    .container:hover {
        transform: translateY(-10px) scale(1.03);
        box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }

    img {
        width: 100%;
        height: 190px;
        object-fit: cover;
        border-radius: 12px;
        transition: transform 0.4s ease;
    }

    .container:hover img {
        transform: scale(1.08);
    }

    p {
        margin: 15px 0 5px;
        font-size: 17px;
        font-weight: 600;
        color: #222;
    }

    b {
        display: inline-block;
        margin-top: 8px;
        background: #e8f5e9;
        color: #2e7d32;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
    }

    /* Optional subtle glow effect */
    .container::before {
        content: "";
        position: absolute;
        width: 120%;
        height: 120%;
        background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
        top: -100%;
        left: -100%;
        transition: 0.6s;
    }

    .container:hover::before {
        top: 100%;
        left: 100%;
    }
</style>

</head>

<body>
