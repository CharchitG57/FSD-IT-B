<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetchuser</title>
</head>
<body>
    <h1>List of user</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>IP Adress</th>
                <th>MAC Address</th>
            </tr>
        </thead>
        <tbody>
            <script>
                const url="https://dummyjson.com/users";
const pr=fetch(url);
pr.then(function(res){
    return res.json();
})
.then((data)=>{
    
    console.log("Data:",data);
})
.catch((err)=>{
    console.log("Error=",err)
})
.finally(()=>{
    console.log("inside finally")
})

            </script>
        </tbody>
    </table>
</body>
</html>
